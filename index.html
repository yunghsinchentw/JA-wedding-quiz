<style>
  :root{
    --ivory:#FBF6EE;
    --ivory-deep:#F1EDE4;
    --wine:#5B7C93;
    --wine-light:#729AB0;
    --gold:#9FB6C2;
    --gold-soft:#DCE7EC;
    --charcoal:#2B2621;
    --sage:#6E7A5E;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--charcoal);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(91,124,147,0.08) 0%, transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(91,124,147,0.07) 0%, transparent 45%);
  }
  .stage{
    width:100%;
    max-width:420px;
    position:relative;
  }
  /* ---------- shared bits ---------- */
  .couple-photo{
    width:190px;height:164px;border-radius:26px;
    margin:0 auto 16px;
    background:var(--ivory-deep);
    border:2px solid var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    color:var(--gold);
    padding:8px;
    box-sizing:border-box;
    animation:photoSway 2.6s ease-in-out infinite;
    transform-origin:center bottom;
  }
  .couple-photo img{
    width:100%;height:100%;object-fit:contain;
  }
  @keyframes photoSway{
    0%, 100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-7px) rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .couple-photo{ animation:none; }
  }
  .monogram{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:15px;
    letter-spacing:0.35em;
    color:var(--wine);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .divider{
    width:52px;
    height:1px;
    background:var(--gold);
    margin:0 auto 22px;
    opacity:0.8;
  }
  h1.title{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:27px;
    line-height:1.3;
    text-align:center;
    color:var(--charcoal);
    margin:0 0 6px;
  }
  .subtitle{
    text-align:center;
    font-size:13.5px;
    color:#7A7168;
    margin:0 0 28px;
    line-height:1.6;
  }
  .card{
    background:#fff;
    border:1px solid rgba(107,39,55,0.1);
    border-radius:var(--radius);
    padding:28px 24px;
    box-shadow:0 18px 40px -22px rgba(43,38,33,0.25);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;}

  /* ---------- screen 1: start ---------- */
  #screen-start .card{padding:34px 26px;}
  .event-picker{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:22px 0 26px;
  }
  .event-opt{
    border:1.5px solid rgba(107,39,55,0.18);
    border-radius:12px;
    padding:13px 16px;
    font-size:14px;
    text-align:left;
    color:var(--charcoal);
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:border-color .2s ease, background .2s ease;
  }
  .event-opt .tag{
    font-size:11px;
    color:var(--wine);
    font-weight:600;
    letter-spacing:0.04em;
  }
  .event-opt.selected{
    border-color:var(--wine);
    background:var(--ivory-deep);
  }
  .btn-primary{
    width:100%;
    background:var(--wine);
    color:#fff;
    padding:15px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.04em;
    transition:background .2s ease, transform .15s ease;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:hover{background:var(--wine-light);}
  .hint-note{
    text-align:center;
    font-size:11.5px;
    color:#A69C8F;
    margin-top:14px;
  }

  /* ---------- screen 2: quiz ---------- */
  #screen-quiz{display:none;}
  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .progress-dots{display:flex;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#E4DCCF;}
  .dot.done{background:var(--gold);}
  .dot.current{background:var(--wine);width:16px;border-radius:4px;}
  .q-counter{font-size:11.5px;color:#A69C8F;letter-spacing:0.05em;}
  .timer-track{
    width:100%;height:3px;background:#EFE7D8;border-radius:3px;overflow:hidden;margin-bottom:22px;
  }
  .timer-fill{height:100%;background:var(--gold);width:100%;transform-origin:left;}
  .q-eyebrow{
    font-size:11px;letter-spacing:0.12em;color:var(--sage);font-weight:600;text-transform:uppercase;margin-bottom:10px;
  }
  .q-text{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:23px;
    line-height:1.4;
    margin:0 0 22px;
    color:var(--charcoal);
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid rgba(43,38,33,0.12);
    font-size:14.5px;
    color:var(--charcoal);
    background:#fff;
    transition:border-color .2s ease, background .2s ease, transform .1s ease;
  }
  .opt-btn:active{transform:scale(0.99);}
  .opt-btn.correct{border-color:var(--sage);background:#F1F4EC;color:#4A5540;font-weight:600;}
  .opt-btn.wrong{border-color:#A69C8F;background:#F2ECE2;color:#8A8074;}
  .opt-btn.disabled{pointer-events:none;opacity:0.55;}
  .opt-btn.disabled.correct,.opt-btn.disabled.wrong{opacity:1;}
  .feedback-line{
    min-height:20px;font-size:12.5px;color:var(--sage);margin-top:14px;text-align:center;font-weight:500;
  }

  /* ---------- screen 3: result ---------- */
  #screen-result{display:none;text-align:center;position:relative;}
  .emoji-burst{
    position:absolute;
    inset:-10px -10px auto -10px;
    height:0;
    pointer-events:none;
    z-index:30;
    overflow:visible;
  }
  .emoji-burst span{
    position:absolute;
    top:40px;
    font-size:26px;
    opacity:0;
    animation:emojiPop 1.5s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay:var(--d, 0s);
    left:var(--l, 50%);
  }
  @keyframes emojiPop{
    0%{transform:translateY(10px) scale(0) rotate(-12deg);opacity:0;}
    18%{transform:translateY(-10px) scale(1.25) rotate(6deg);opacity:1;}
    35%{transform:translateY(0) scale(1) rotate(0deg);opacity:1;}
    78%{transform:translateY(-46px) scale(1) rotate(0deg);opacity:1;}
    100%{transform:translateY(-78px) scale(0.75) rotate(8deg);opacity:0;}
  }
  .seal{
    width:132px;height:132px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--wine-light), var(--wine) 70%);
    margin:4px auto 20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 26px -10px rgba(91,124,147,0.55), inset 0 0 0 3px rgba(255,255,255,0.15);
    position:relative;
    padding:14px;
    box-sizing:border-box;
  }
  .seal::before{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    border:1px dashed var(--gold-soft);opacity:0.9;
  }
  .seal-tier{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;
    color:#fff;font-size:17px;line-height:1.3;letter-spacing:0.02em;text-align:center;
  }
  .tier-sub{font-size:13px;color:#7A7168;margin:0 0 20px;line-height:1.6;}
  .score-row{
    display:flex;justify-content:center;gap:18px;margin-bottom:22px;
  }
  .score-item .num{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--charcoal);}
  .score-item .lbl{font-size:10.5px;color:#A69C8F;letter-spacing:0.04em;text-transform:uppercase;}
  .btn-ghost{
    width:100%;padding:14px;border-radius:12px;border:1.5px solid rgba(91,124,147,0.3);
    font-size:14px;color:var(--wine);font-weight:600;margin-top:10px;background:#fff;
  }
  .closing-logo{
    margin-top:26px;
    display:flex;
    justify-content:center;
  }
  .closing-logo img{
    width:120px;
    height:auto;
    opacity:0.92;
  }

  .name-field{margin-bottom:18px;}
  .name-field input{
    width:100%;
    padding:13px 16px;
    border-radius:12px;
    border:1.5px solid rgba(91,124,147,0.25);
    font-family:'Work Sans',sans-serif;
    font-size:14px;
    color:var(--charcoal);
    background:#fff;
  }
  .name-field input::placeholder{color:#B3A99B;}
  .name-field input:focus{outline:none;border-color:var(--wine);}

  .guest-name{
    font-family:'Cormorant Garamond',serif;
    font-size:20px;font-weight:600;color:#1E3A5F;margin:-4px 0 6px;
  }
  .screenshot-note{
    margin-top:18px;
    background:var(--ivory-deep);
    border:1px dashed var(--gold);
    border-radius:12px;
    padding:12px 14px;
    font-size:12.5px;
    color:var(--wine);
    line-height:1.6;
  }

  .demo-flag{
    position:fixed;top:10px;left:50%;transform:translateX(-50%);
    background:var(--charcoal);color:#fff;font-size:10.5px;padding:5px 12px;border-radius:20px;
    letter-spacing:0.05em;opacity:0.8;z-index:50;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>

<script>
/* ======================================================================

   ----------------------------------------------------------------------
   1. 下面 QUESTIONS 陣列就是題庫,目前是「示範內容」，請直接替換成
      你們真實的故事、興趣、婚禮小知識。
      - text: 題目文字（可中英夾雜）
      - options: 4 個選項（陣列）
      - correct: 正確答案在 options 中的 index（從 0 開始）
      - eyebrow: 題目上方的小分類標籤，例如「認識新人」「猜猜看」「婚禮小知識」

   2. TIERS 是最後的分數等級，可依你喜歡的稱呼修改文字。

   3. 若想針對不同場次（台中/峇里島/台北）出不同題目，可以把
      QUESTIONS 改成依 event 分組的物件，目前為求示範簡單，
      三場暫時共用同一組題目。

   4. 顏色、字型、版面在 <style> 區塊，改動 CSS 變數（--wine, --gold 等）
      即可調整整體色調。
   ====================================================================== */

const QUESTIONS = [
  {
    eyebrow: "認識新人",
    text: "James 和 Ariel 是在什麼場合認識的？",
    options: ["TRIO", "HIBORU", "NEEDLE", "Moonrock"],
    correct: 0
  },
  {
    eyebrow: "猜猜看",
    text: "兩人之中，誰比較容易賴床？",
    options: ["James", "Ariel", "兩個人一樣", "沒有人賴床"],
    correct: 0
  },
  {
    eyebrow: "婚禮小知識",
    text: "峇里島證婚的舉辦地點是？",
    options: ["Ubud", "Nusa Dua", "Canggu", "Seminyak"],
    correct: 1
  },
  {
    eyebrow: "認識新人",
    text: "James 的職業是？",
    options: ["烈酒品牌大使", "建築師", "廚師", "攝影師"],
    correct: 0
  },
  {
    eyebrow: "認識新人",
    text: "James & Ariel 本名是？",
    options: ["陳廷鈞 王詠心", "王庭鈞 陳詠欣", "王廷釣 陳詠心", "王廷鈞 陳詠心"],
    correct: 3
  },
  {
    eyebrow: "婚禮小知識",
    text: "兩人交往到今天婚禮這天，經過了多久？",
    options: ["3年10個月", "4年5個月", "4年11個月", "5年3個月"],
    correct: 1
  },
  {
    eyebrow: "婚禮小知識",
    text: "James & Ariel 總共有幾場婚禮？",
    options: ["1", "2", "3", "4"],
    correct: 2
  },
  {
    eyebrow: "認識新人",
    text: "兩人共同的興趣是？",
    options: ["打架", "煮飯", "喝酒", "旅行"],
    correct: 3
  },
  {
    eyebrow: "猜猜看",
    text: "求婚是在哪裡發生的？",
    options: ["家裡", "旅行途中", "餐廳酒吧", "海邊"],
    correct: 2
  },
  {
    eyebrow: "婚禮小知識",
    text: "從求婚到婚禮這天，經過了多久？",
    options: ["1年10個月", "2年13天", "2年1個月", "3年"],
    correct: 1
  }
];

const TIERS = [
  { min: 1,    name: "百分百知心友", sub: "你就是我們的閨蜜＆兄弟！愛你唷。" },
  { min: 0.9,  name: "頭號冰友", sub: "你懂我，我懂你！這份熟悉感，敬你一杯。" },
  { min: 0.8,  name: "麻吉麻是你", sub: "我相信你可以更了解我們，還要多約約聊聊呀" },
  { min: 0.5,  name: "普通熟", sub: "基本認識沒問題，看來還有更多故事等你慢慢挖掘。" },
  { min: 0,    name: "威~該多聊聊了", sub: "沒關係，今天就是重新認識我們的好機會，玩得盡興喔！" }
];

let currentIndex = 0;
let score = 0;
let totalPoints = 0;
let questionStartTime = 0;
let guestName = '';
let timerInterval = null;
const TIME_PER_Q = 10;
const BASE_POINTS = 100;

const screenStart = document.getElementById('screen-start');
const screenQuiz = document.getElementById('screen-quiz');
const screenResult = document.getElementById('screen-result');

document.getElementById('startBtn').addEventListener('click', startQuiz);
document.getElementById('retryBtn').addEventListener('click', ()=>{
  currentIndex = 0; score = 0; totalPoints = 0;
  screenResult.style.display = 'none';
  screenStart.style.display = 'block';
});

function startQuiz(){
  currentIndex = 0; score = 0; totalPoints = 0;
  guestName = document.getElementById('guestName').value.trim();
  screenStart.style.display = 'none';
  screenQuiz.style.display = 'block';
  buildDots();
  renderQuestion();
}

function buildDots(){
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = '';
  QUESTIONS.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.dataset.i = i;
    wrap.appendChild(d);
  });
}

function updateDots(){
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.remove('done','current');
    if(i < currentIndex) d.classList.add('done');
    else if(i === currentIndex) d.classList.add('current');
  });
}

function renderQuestion(){
  clearInterval(timerInterval);
  const q = QUESTIONS[currentIndex];
  document.getElementById('qCounter').textContent = `${currentIndex+1} / ${QUESTIONS.length}`;
  document.getElementById('qEyebrow').textContent = q.eyebrow;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('feedbackLine').textContent = '';
  updateDots();

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  q.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = opt;
    b.addEventListener('click', ()=>selectAnswer(i));
    optWrap.appendChild(b);
  });

  runTimer();
  questionStartTime = Date.now();
}

function runTimer(){
  const fill = document.getElementById('timerFill');
  fill.style.transition = 'none';
  fill.style.transform = 'scaleX(1)';
  void fill.offsetWidth;
  fill.style.transition = `transform ${TIME_PER_Q}s linear`;
  fill.style.transform = 'scaleX(0)';

  let elapsed = 0;
  timerInterval = setInterval(()=>{
    elapsed += 1;
    if(elapsed >= TIME_PER_Q){
      clearInterval(timerInterval);
      selectAnswer(-1);
    }
  }, 1000);
}

function selectAnswer(choiceIndex){
  clearInterval(timerInterval);
  const q = QUESTIONS[currentIndex];
  const buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach((b,i)=>{
    b.classList.add('disabled');
    if(i === q.correct) b.classList.add('correct');
    if(i === choiceIndex && choiceIndex !== q.correct) b.classList.add('wrong');
  });

  const feedback = document.getElementById('feedbackLine');
  if(choiceIndex === q.correct){
    const elapsedMs = Date.now() - questionStartTime;
    const timeLeftMs = Math.max(0, TIME_PER_Q * 1000 - elapsedMs);
    const fraction = timeLeftMs / (TIME_PER_Q * 1000);
    // 答對至少拿 30% 基本分，回答越快，分數越接近滿分
    const points = Math.round(BASE_POINTS * (0.3 + 0.7 * fraction));
    score += 1;
    totalPoints += points;
    const seconds = (elapsedMs / 1000).toFixed(1);
    feedback.textContent = `答對了！+${points} 分（用時 ${seconds} 秒）`;
  } else if(choiceIndex === -1){
    feedback.textContent = '時間到！Time is up. +0 分';
  } else {
    feedback.textContent = '可惜，再接再厲。+0 分';
  }

  setTimeout(()=>{
    currentIndex += 1;
    if(currentIndex < QUESTIONS.length){
      renderQuestion();
    } else {
      showResult();
    }
  }, 1400);
}

function showResult(){
  screenQuiz.style.display = 'none';
  screenResult.style.display = 'block';
  const pct = score / QUESTIONS.length;
  const tier = TIERS.find(t => pct >= t.min);
  document.getElementById('guestNameDisplay').textContent = guestName ? guestName : '';
  document.getElementById('sealTier').textContent = tier.name;
  document.getElementById('tierSub').textContent = tier.sub;
  document.getElementById('scorePoints').textContent = totalPoints;
  document.getElementById('scoreNum').textContent = `${score}/${QUESTIONS.length}`;
  document.getElementById('scorePct').textContent = `${Math.round(pct*100)}%`;
  launchEmojiBurst();
}

function launchEmojiBurst(){
  const burst = document.getElementById('emojiBurst');
  burst.innerHTML = '';
  const emojis = ['🎉','🥂','💛','✨','👏','🍾','💍','🎊'];
  const count = 12;
  for(let i = 0; i < count; i++){
    const span = document.createElement('span');
    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const leftPct = 6 + Math.random() * 88;
    const delay = (Math.random() * 0.5).toFixed(2);
    span.style.setProperty('--l', `${leftPct}%`);
    span.style.setProperty('--d', `${delay}s`);
    span.style.fontSize = `${20 + Math.random() * 14}px`;
    burst.appendChild(span);
  }
}
</script>

</body>
</html>
